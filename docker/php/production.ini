; OPcache sized for Augias, measured on the image (28/09/2026): the public
; pages alone load 4 564 scripts into 80 MB, with 16 MB of interned strings.
; PHP's defaults (128 MB, 8 MB of strings, 10 000 files) leave the strings
; overflowing, and the signed-in pages, which load more code, close to the
; memory ceiling. Shared memory is only taken as it fills, so the headroom
; costs nothing until it is used.
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; Timestamps stay checked. The Symfony cache is built on first boot inside
; the container, and a `cache:clear` run in a live container would otherwise
; leave PHP serving the previous code until the next restart.

realpath_cache_size=4096K
realpath_cache_ttl=600

; Off for good. Augias never reads upload progress, and it is the path PHP2Shell
; (CVE-2026-109619) goes through, as well as the precondition of the unpatched
; CVE-2026-115560. It has to be set here, before the request is parsed:
; ini_set() comes too late. The PHP version that fixes PHP2Shell is 8.4.27,
; which the php8.4 base image carries since 21/10/2026.
session.upload_progress.enabled=0

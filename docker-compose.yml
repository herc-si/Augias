services:
  db:
    # PostgreSQL rather than MySQL. Both are supported and covered by CI, so a
    # self-hosted install keeps the choice — but this file is the stack we
    # recommend, and two defects found on 2026-09-17 decided it: date range
    # bounds bind as `datetime` against `DATE` columns, and MySQL reorders the
    # keys of a JSON column. PostgreSQL is strict where those bugs are silent.
    image: "postgres:17"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_DB: augias
      POSTGRES_USER: augias
      # No default on purpose: `docker compose up` stops with this message
      # rather than starting a database anyone on the network can open.
      POSTGRES_PASSWORD: ${AUGIAS_DB_PASSWORD:?set AUGIAS_DB_PASSWORD in a .env file next to this one}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U augias -d augias"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: "augias/augias:latest"
    depends_on:
      # The first-run wizard asks for database details, so the database has to
      # be accepting connections by the time someone reaches that screen —
      # `service_started` would not guarantee it.
      db:
        condition: service_healthy
    ports:
      - "8765:8765"
    restart: always
    environment:
      # Supporting documents outlive the container they were uploaded from —
      # the retention obligation is counted in years — so they are written to a
      # volume rather than to the image's own filesystem.
      AUGIAS_ATTACHMENTS_DIR: /var/augias/attachments
    volumes:
      - app_data:/etc/augias
      - attachments_data:/var/augias/attachments

volumes:
  db_data: {}
  app_data: {}
  attachments_data: {}

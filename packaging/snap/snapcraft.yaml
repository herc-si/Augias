name: augias
title: Augias
version: ${AUGIAS_VERSION}
summary: Simple and elegant invoicing solution
description: |
  Augias is an open-source invoicing application for small businesses
  and freelancers. Features include client management, quotes, invoices
  (including recurring), payments, tax and discount management, a REST API,
  and notifications.

  Augias ships as a self-contained binary with an embedded web server.
  No PHP, Apache, or Nginx installation required.

  After installation, start the application with:
    sudo snap start augias

  Then open your browser to http://localhost:8765 to complete setup.

  Configuration can be set via snap configuration:
    sudo snap set augias port=8080

license: MIT
base: core24
confinement: strict
grade: stable

apps:
  augias:
    command: bin/augias run --disable-https --skip-intro --log-format json
    daemon: simple
    restart-condition: on-failure
    restart-delay: 5s
    plugs:
      - network
      - network-bind
    environment:
      AUGIAS_CONFIG_DIR: $SNAP_COMMON/config
      HOME: $SNAP_COMMON

  cli:
    command: bin/augias
    plugs:
      - network
      - network-bind

parts:
  augias:
    plugin: dump
    source: dist/
    source-type: local
    organize:
      augias-linux-*: bin/augias
    stage:
      - bin/augias

# nFPM configuration for SolidInvoice
# https://nfpm.goreleaser.com/configuration/
#
# Build packages with:
#   nfpm package -p deb -f packaging/nfpm.yaml -t dist/
#   nfpm package -p rpm -f packaging/nfpm.yaml -t dist/
#   nfpm package -p apk -f packaging/nfpm.yaml -t dist/
#   nfpm package -p archlinux -f packaging/nfpm.yaml -t dist/
#
# Override architecture with:
#   nfpm package -p deb -f packaging/nfpm.yaml --target dist/ --arch arm64

name: augias
arch: ${NFPM_ARCH}
version: ${AUGIAS_VERSION}
release: 1
epoch: 0
section: web
priority: optional

maintainer: HERC SI <opensource@herc-si.fr>
vendor: HERC SI
homepage: https://augias.herc-si.fr
license: MIT
description: |
  The open-source invoicing platform for freelancers and small businesses.
  Augias is an open-source invoicing application for small businesses
  and freelancers. Features include client management, quotes, invoices
  (including recurring), payments, tax and discount management, a REST API,
  and notifications.

contents:
  # Binary
  - src: ../frankenphp/dist/augias-linux
    dst: /usr/bin/augias
    file_info:
      mode: 0755

  # systemd service
  - src: systemd/augias.service
    dst: /usr/lib/systemd/system/augias.service
    file_info:
      mode: 0644

  # Default environment file
  - src: systemd/augias.env
    dst: /etc/augias/augias.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: augias

  # Create required directories
  - dst: /var/lib/augias
    type: dir
    file_info:
      mode: 0750
      owner: augias
      group: augias

  - dst: /etc/augias
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: augias

scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

overrides:
  deb:
    recommends:
      - mysql-server | mariadb-server
    suggests:
      - postgresql
      - nginx
  rpm:
    recommends:
      - mysql-server
      - mariadb-server
    suggests:
      - postgresql-server
      - nginx

        paypal_express_checkout:
            display_name: 'PayPal Express Checkout'
            overview: 'PayPal Express Checkout sends your client to PayPal to approve the payment, then returns them to Augias. Clients can pay with their PayPal balance or a credit/debit card - no PayPal account required for card payments.'
            tagline: 'Let clients pay with their PayPal account or a card.'
        paypal_pro_checkout:
            display_name: 'PayPal Pro (Payflow)'
            overview: "PayPal Pro (Payflow) processes card payments without sending customers to PayPal. It requires a paid PayPal Payments Pro or Payflow account. If you don't have one, use PayPal Express Checkout instead."
            tagline: 'Take card payments on-site (needs a PayPal Pro account).'

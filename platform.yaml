platform:
    name: !php/const Augias\CoreBundle\AugiasCoreBundle::APP_NAME
    version: !php/const Augias\CoreBundle\AugiasCoreBundle::VERSION

    security:
        two_factor:
            enabled: true
            base_template: "@AugiasCore/Layout/two_factor_security.html.twig"
    models:
        user: Augias\UserBundle\Entity\User

saas:
    doctrine:
        subscriptions:
            entity: Augias\CoreBundle\Entity\Company
        trial:
            user_entity: Augias\UserBundle\Entity\User
    payment:
        return_route: saas_payment_success
    integration:
        lemon_squeezy:
            enabled: true
            api_key: '%env(AUGIAS_LEMON_SQUEEZY_API_KEY)%'
            webhook_secret: '%env(AUGIAS_LEMON_SQUEEZY_WEBHOOK_SECRET)%'
            store_id: '%env(AUGIAS_LEMON_SQUEEZY_STORE_ID)%'
    # Canonical catalogue of every gated feature. Keep the keys here in lock-step
    # with `Augias\SaasBundle\Feature\Feature` (asserted by FeatureCatalogTest).
    # Defaults are the un-overridden values returned by FeatureGate::resolve()
    # when no plan/subscriber is in context (CLI commands, fixtures, etc.).
    features:
        total_clients:
            type: integer
            default: -1
            description: 'Maximum number of clients per company (-1 = unlimited).'
        invoices_per_month:
            type: integer
            default: -1
            description: 'Invoices that can be issued per calendar month (-1 = unlimited).'
        team_seats:
            type: integer
            default: -1
            description: 'Number of user seats per company (-1 = unlimited).'
        quotes:
            type: boolean
            default: true
            description: 'Quote management and conversion-to-invoice workflow.'
        online_payments:
            type: boolean
            default: true
            description: 'Accept online payments via the Payum gateway.'
        recurring_invoices:
            type: boolean
            default: true
            description: 'Schedule and auto-generate recurring invoices.'
        automated_reminders:
            type: boolean
            default: true
            description: 'Automatic invoice reminders for overdue invoices.'
        multi_currency:
            type: boolean
            default: true
            description: 'Issue invoices, quotes and accept payments in multiple currencies.'
        custom_branding:
            type: boolean
            default: true
            description: 'Custom logo, theme and white-label PDF/email templates.'
        rest_api_access:
            type: boolean
            default: true
            description: 'Public REST API access and API token management.'
        mcp_access:
            type: boolean
            default: true
            description: 'Model Context Protocol server access for AI agents.'
        custom_domain:
            type: boolean
            default: true
            description: 'Host Augias on a custom domain or subdomain.'
        custom_fields:
            type: boolean
            default: true
            description: 'Capture and display custom fields on clients, contacts, invoices, quotes and recurring invoices.'
        custom_templates:
            type: boolean
            default: true
            description: 'Choose a custom design template for invoices and quotes across PDFs, emails and the client portal.'
        # Off by default, unlike the others: it lets someone from outside into
        # the company, so a plan has it only when the operator says so.
        support_access:
            type: boolean
            default: false
            description: 'Ask the people running the service for help, and let them look in, read-only, for a set time.'
        # Companies one subscription pays for, its own included: the others are
        # opened by the same owner and follow it. One unless the plan says more.
        companies:
            type: integer
            default: 1
            description: 'Companies covered by one subscription, its own included (-1 = unlimited).'

ui:
    templates:
        base: '@AugiasCore/Layout/base.html.twig'
        login: '@AugiasUser/Security/login.html.twig'

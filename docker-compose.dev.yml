# Local development stack: runs the app FROM THE LOCAL SOURCE TREE (bind-mounted),
# not the published `augias/augias` image. Use docker-compose.yml
# instead if you just want to run a prebuilt release.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# First run installs Composer and frontend (Bun) dependencies automatically,
# baked into named volumes so they survive restarts and don't get written
# into your working tree. Nothing needs to be pre-installed on the host.
#
# By default the app uses SQLite (Augias's default, inherited from SolidInvoice — see
# config/services.php), so no separate database container is required. To use
# MySQL instead, uncomment the `db` service and the `AUGIAS_DATABASE_URL`
# line below.

services:
  assets:
    image: "oven/bun:1.3.14"
    working_dir: /app
    volumes:
      - .:/app
      - dev_vendor:/app/vendor
      - dev_node_modules:/app/node_modules
    # A few JS packages (@solidworx/platform, @symfony/ux-*) are `file:vendor/...`
    # deps that only exist once Composer has run in the `app` container, so wait
    # for that instead of racing it.
    command: >
      sh -c "until [ -d vendor/solidworx/platform/assets ]; do sleep 1; done &&
             bun install --frozen-lockfile && bun run watch"
    # Same reasoning as `app`: a watcher that has quietly died is a watcher
    # whose absence is discovered by a stylesheet that will not update.
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8765:8765"
    environment:
      AUGIAS_ENV: dev
      AUGIAS_DEBUG: 1
      SERVER_NAME: ":8765"
      APP_PATH: /app
      # Every e-mail the app sends lands in Mailpit (below), never in a real
      # inbox. A company that configures its own delivery in Settings > E-mail
      # still overrides this, as in production.
      AUGIAS_MAILER_DSN: "smtp://mailpit:1025"
      # AUGIAS_DATABASE_URL: "mysql://root@db:3306/augias?serverVersion=8.0"
    # The frankenphp base image probes Caddy's admin API on :2019, which the
    # Caddyfile turns off (`admin off`), so the inherited check can never pass
    # and the container sits permanently "unhealthy". Probe the /health
    # endpoint the Caddyfile actually defines instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - .:/app
      - dev_vendor:/app/vendor
      - dev_var:/app/var
    command: >
      sh -c "composer install --no-interaction --optimize-autoloader &&
             frankenphp run --config /app/Caddyfile"
    # The server dies on its own occasionally: PHP here is a threaded build
    # (ZTS, as FrankenPHP requires) and has been seen aborting with
    # `zend_mm_heap corrupted` under heavy local load — twice while running the
    # test suite, with no memory pressure and no kernel OOM kill. The cause is
    # not understood. What is understood is that without a restart policy the
    # container stays dead until someone notices, which turns a five-second blip
    # into a stopped afternoon. `worker` and `cron` below already say this; the
    # two that a developer actually interacts with did not.
    restart: unless-stopped
    # depends_on:
    #   - db

  # Processes async messages (emails, recurring-invoice jobs, ...) — the
  # equivalent of the managed `messenger_consume` worker that `symfony serve`
  # starts automatically (see docs/docs/installation-guide/git.md). Not
  # strictly required to browse the app, but without it queued messages just
  # pile up unprocessed.
  worker:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    # No HTTP surface here, so the frankenphp base image's Caddy admin probe is
    # meaningless rather than merely misconfigured — it would sit "unhealthy"
    # forever and teach you to ignore the column. Liveness is already covered:
    # if the consumer dies the shell exits, the container exits, and the
    # restart policy above brings it back.
    healthcheck:
      disable: true
    # Two reasons to come back up, and `on-failure` only covers the first: it
    # exits non-zero until the database exists (created by the /install wizard
    # on first run), and it exits *zero* every time it hits its own
    # --time-limit/--memory-limit below, which otherwise leaves the queue
    # unprocessed until someone notices the container is gone.
    restart: unless-stopped
    environment:
      AUGIAS_ENV: dev
      AUGIAS_DEBUG: 1
      # The worker is what sends queued e-mails: it must reach Mailpit too.
      AUGIAS_MAILER_DSN: "smtp://mailpit:1025"
      # AUGIAS_DATABASE_URL: "mysql://root@db:3306/augias?serverVersion=8.0"
    volumes:
      - .:/app
      - dev_vendor:/app/vendor
      - dev_var:/app/var
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do sleep 1; done &&
             bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv"
    # depends_on:
    #   - db

  # Runs scheduled tasks (hourly electronic-invoicing status/incoming polls,
  # recurring-invoice generation, marking invoices overdue, ...). Each
  # #[AsCronTask(schedule: 'x')] gets its own Messenger transport named
  # `scheduler_x` (confirmed via `messenger:consume poll_super_pdp_invoice_status`,
  # which lists every registered receiver) — `--all` consumes every one of
  # them as they come due, in a single long-running process; `async`/`failed`
  # are excluded since `worker` above already owns `async` and `failed` is a
  # dead-letter store, not something to actively consume. cron:run/schedule:run
  # (a leftover from a different scheduling library) does NOT work with
  # symfony/scheduler and was never wired into any container here — without
  # this service, every #[AsCronTask] job silently never ran locally.
  cron:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    # No HTTP surface here, so the frankenphp base image's Caddy admin probe is
    # meaningless rather than merely misconfigured — it would sit "unhealthy"
    # forever and teach you to ignore the column. Liveness is already covered:
    # if the consumer dies the shell exits, the container exits, and the
    # restart policy above brings it back.
    healthcheck:
      disable: true
    # Self-limits and exits zero like worker, so `on-failure` never revives it.
    restart: unless-stopped
    environment:
      AUGIAS_ENV: dev
      AUGIAS_DEBUG: 1
      AUGIAS_MAILER_DSN: "smtp://mailpit:1025"
    volumes:
      - .:/app
      - dev_vendor:/app/vendor
      - dev_var:/app/var
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do sleep 1; done &&
             bin/console messenger:consume --all --exclude-receivers=async --exclude-receivers=failed --time-limit=3600 --memory-limit=128M -vv"

  # Catches every e-mail the dev stack sends and shows it at
  # http://localhost:8025 — invoices, reminders, password resets — without a
  # single one reaching a real address. SMTP on mailpit:1025 inside the network.
  mailpit:
    image: "axllent/mailpit:v1.27"
    ports:
      - "8025:8025"
    restart: unless-stopped

  # db:
  #   image: "mysql:8.0"
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: augias
  #     MYSQL_ALLOW_EMPTY_PASSWORD: 1
  #   volumes:
  #     - dev_db_data:/var/lib/mysql

volumes:
  dev_vendor: {}
  dev_var: {}
  dev_node_modules: {}
  # dev_db_data: {}
